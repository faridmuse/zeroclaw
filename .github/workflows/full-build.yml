name: Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build zeroclaw (ci-all, x86_64-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh mold libudev-dev libasound2-dev musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build (ci-all, musl)
        run: cargo build --release --features ci-all --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-full-musl
          path: target/x86_64-unknown-linux-musl/release/zeroclaw
