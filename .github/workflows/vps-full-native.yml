name: VPS full native

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build zeroclaw (all features, Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh mold libudev-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web
        run: |
          cd web && npm ci --ignore-scripts
          cd .. && cargo web build

      - name: Build (all features)
        run: cargo build --release --locked -p zeroclaw --all-features

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-full-2204-all
          path: target/release/zeroclaw
